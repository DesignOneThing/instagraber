services:
  - type: web
    name: instagrab
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m instagrab
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MAX_UPLOAD_MB
        value: "49"
      - key: MAX_DOWNLOAD_MB
        value: "250"
      - key: INSTAGRAM_COOKIES_TEXT
        sync: false
